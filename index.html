<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>DGC Weekly Timesheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0b3d6c;
    --orange: #dd7817;
    --green: #2e7d46;
    --green-dark: #235f36;

    --bg: #eef1f4;
    --surface: #ffffff;
    --tile-empty: #d6dbe1;
    --tile-empty-text: #6b7580;
    --border: #dde1e6;
    --text: #16212c;
    --text-muted: #5b6672;
    --focus-ring: #0b3d6c;
    --link-accent: #0b3d6c;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151b;
      --surface: #1a2129;
      --tile-empty: #2b333c;
      --tile-empty-text: #97a2ac;
      --border: #313a44;
      --text: #eef2f5;
      --text-muted: #9aa5b0;
      --focus-ring: #6fa8dc;
      --link-accent: #7fb3e8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10151b;
    --surface: #1a2129;
    --tile-empty: #2b333c;
    --tile-empty-text: #97a2ac;
    --border: #313a44;
    --text: #eef2f5;
    --text-muted: #9aa5b0;
    --focus-ring: #6fa8dc;
    --link-accent: #7fb3e8;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }
  h1 {
    font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--surface);
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 16px 20px 16px;
  }
  .header-logo {
    display: block;
    width: auto;
    height: 60px;
    margin: 0 auto 10px;
  }
  header h1 {
    margin: 0;
    font-size: clamp(1.1rem, 4.5vw, 1.35rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  header h1:empty { display: none; }
  header .sub {
    margin-top: 6px;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.82);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header .sub button {
    background: none;
    border: none;
    color: rgba(255,255,255,0.82);
    text-decoration: underline;
    text-underline-offset: 2px;
    font-size: 0.8rem;
    padding: 4px 0;
    cursor: pointer;
    font-family: inherit;
  }
  header .sub button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 2px; }
  main {
    flex: 1;
    padding: 18px 20px 40px;
  }
  .week-meta {
    font-size: 0.95rem;
    color: var(--text-muted);
    margin-bottom: 18px;
  }
  .tiles {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .tile {
    width: 100%;
    border: none;
    border-radius: 8px;
    padding: 16px 14px;
    font-size: 1rem;
    font-weight: 700;
    font-family: "Archivo", inherit;
    letter-spacing: -0.005em;
    color: var(--tile-empty-text);
    background: var(--tile-empty);
    text-align: center;
    cursor: pointer;
    transition: transform 0.05s ease;
  }
  @media (prefers-reduced-motion: no-preference) {
    .tile:active { transform: scale(0.98); }
  }
  .tile.filled { background: var(--navy); color: #fff; }
  .tile.today { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--orange); }
  .tile:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
  .tile .day-hours {
    display: block;
    font-weight: 500;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.78rem;
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
    opacity: 0.92;
  }
  .save-btn, .primary-btn {
    width: 100%;
    border: none;
    border-radius: 8px;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 700;
    font-family: "Archivo", inherit;
    color: #fff;
    background: var(--green);
    cursor: pointer;
    margin-top: 22px;
  }
  .save-btn:active, .primary-btn:active { background: var(--green-dark); }
  .save-btn:focus-visible, .primary-btn:focus-visible {
    outline: 3px solid var(--focus-ring); outline-offset: 2px;
  }
  .save-btn:disabled { background: #7f9f89; cursor: not-allowed; }

  /* Day entry screen */
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 0.83rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 7px;
  }
  .field select, .field input[type=text], .field input[type=time],
  .field input[type=number], .field textarea {
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
  }
  .field select:focus-visible, .field input:focus-visible, .field textarea:focus-visible {
    outline: 2px solid var(--focus-ring); outline-offset: 1px;
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field select:disabled, .field input:disabled, .field textarea:disabled {
    background: var(--tile-empty);
    color: var(--text-muted);
    opacity: 1;
    -webkit-text-fill-color: var(--text-muted);
  }
  .row-2 {
    display: flex;
    gap: 14px;
  }
  .row-2 .field { flex: 1; min-width: 0; }
  .add-site-link {
    display: inline-block;
    margin-top: 9px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--link-accent);
    text-decoration: none;
    cursor: pointer;
  }
  .hours-display {
    text-align: center;
    font-size: 1.2rem;
    font-weight: 800;
    font-family: "Archivo", inherit;
    font-variant-numeric: tabular-nums;
    margin: 6px 0 22px;
    color: var(--link-accent);
  }
  .back-link {
    background: none;
    border: none;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 0;
    margin-bottom: 8px;
    cursor: pointer;
    opacity: 0.92;
    font-family: inherit;
  }
  .back-link:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 2px; }
  .version {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.72rem;
    margin-top: 26px;
  }
  .hidden { display: none !important; }

  /* Name-entry overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay-card {
    background: var(--surface);
    border-radius: 10px;
    padding: 26px 22px;
    width: 100%;
    max-width: 340px;
  }
  .overlay-card h2 {
    margin: 0 0 8px;
    font-size: 1.2rem;
    font-family: "Archivo", inherit;
    font-weight: 800;
  }
  .overlay-card p { margin: 0 0 18px; font-size: 0.85rem; color: var(--text-muted); }
  .overlay-back {
    background: none;
    border: none;
    color: var(--link-accent);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0;
    margin-bottom: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .auth-error {
    background: rgba(220, 53, 40, 0.12);
    color: #c62f22;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 16px;
  }
  :root:not([data-theme="light"]) .auth-error { color: #ff8a7a; }
  :root[data-theme="dark"] .auth-error { color: #ff8a7a; }
  .auth-switch {
    display: block;
    text-align: center;
    margin-top: 16px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--link-accent);
    text-decoration: none;
    cursor: pointer;
  }
</style>
</head>

    <h1 id="headerTitle"></h1>
    <div class="sub" id="headerSub">
      <span id="headerSubText"></span>
      <button onclick="logout()">Log out</button>
    </div>
  </header>

  <main>

    <!-- WEEK VIEW -->
    <section id="weekView">
      <div class="week-meta" id="weekMeta"></div>
      <div class="tiles" id="tiles"></div>
    </section>

    <!-- DAY VIEW -->
    <section id="dayView" class="hidden">

      <div class="field">
        <label>Site</label>
        <select id="siteSelect" onchange="onSiteChange()"></select>
        <a class="add-site-link" id="addSiteLink" onclick="showAddSite()">+ Add new site</a>
        <div class="field hidden" id="newSiteField" style="margin-top:10px;">
          <input type="text" id="newSiteInput" placeholder="Type new site name">
        </div>
      </div>

      <div class="field">
        <label>Description of Work</label>
        <textarea id="descInput" placeholder="e.g. Excavating trench, laying pipe..."></textarea>
      </div>

      <div class="row-2">
        <div class="field">
          <label>Start (24hr)</label>
          <input type="time" id="startInput" value="08:00" onchange="recalcHours()">
        </div>
        <div class="field">
          <label>Finish (24hr)</label>
          <input type="time" id="finishInput" value="17:00" onchange="recalcHours()">
        </div>
      </div>

      <div class="field">
        <label>Lunch (mins)</label>
        <input type="number" id="lunchInput" placeholder="e.g. 30" min="0" step="5" value="30" oninput="recalcHours()">
      </div>

      <div class="hours-display" id="hoursDisplay">Hours: 0h 0m</div>

      <div class="field">
        <label>Notes</label>
        <textarea id="notesInput" placeholder="Optional"></textarea>
      </div>

      <button class="save-btn" id="saveDayBtn" onclick="saveDay()">Save &amp; Send</button>
    </section>

  </main>

  <div class="version">v1.0</div>
</div>

function pad(n) { return n < 10 ? "0" + n : "" + n; }
function fmtHM(hoursDecimal) {
  const totalMins = Math.round(hoursDecimal * 60);
  const h = Math.floor(totalMins / 60);
  const m = totalMins % 60;
  return h + "h " + m + "m";
}
function isoDate(d) { return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function fmtShort(d) { return DAY_NAMES[(d.getDay()+6)%7] + " " + pad(d.getDate()) + " " + MONTH_NAMES[d.getMonth()]; }
function fmtLong(d) { return pad(d.getDate()) + "/" + pad(d.getMonth()+1) + "/" + d.getFullYear(); }

function getMonday(d) {
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7;
  date.setDate(date.getDate() - day);
  date.setHours(0,0,0,0);
  return date;
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

// ---------- Auth ----------

function showLogin() {
  document.getElementById("signupOverlay").classList.add("hidden");
  document.getElementById("loginError").classList.add("hidden");
  document.getElementById("loginOverlay").classList.remove("hidden");
}

async function showSignup() {
  document.getElementById("loginOverlay").classList.add("hidden");
  const err = document.getElementById("signupError");
  err.classList.add("hidden");
  err.textContent = "";
  document.getElementById("signupEmail").value = "";
  document.getElementById("signupPassword").value = "";
  document.getElementById("signupPassword2").value = "";
  document.getElementById("signupOverlay").classList.remove("hidden");
  await populateStaffNames();
}

async function populateStaffNames() {
  const sel = document.getElementById("signupNameSelect");
  sel.innerHTML = '<option value="">Loading staff list...</option>';
  try {
    const r = await fetch(
      PLANNER_URL + "/rest/v1/dgc_staff?select=name&status=eq.Working&order=name",
      { headers: { apikey: PLANNER_KEY } }
    );
    if (!r.ok) throw new Error("bad response");
    const rows = await r.json();
    sel.innerHTML = '<option value="">Select your name...</option>';
    rows.forEach(row => {
      const opt = document.createElement("option");
      opt.value = row.name; opt.textContent = row.name;
      sel.appendChild(opt);
    });
  } catch (e) {
    sel.innerHTML = '<option value="">Couldn\'t load staff list — try again</option>';
  }
}

function signupFail(msg) {
  const err = document.getElementById("signupError");
  err.textContent = msg;
  err.classList.remove("hidden");
}

function loginFail(msg) {
  const err = document.getElementById("loginError");
  err.textContent = msg;
  err.classList.remove("hidden");
}

async function doSignup() {
  const fullName = document.getElementById("signupNameSelect").value;
  const email = document.getElementById("signupEmail").value.trim().toLowerCase();
  const password = document.getElementById("signupPassword").value;
  const password2 = document.getElementById("signupPassword2").value;

  if (!fullName || !email || !password) { signupFail("Please fill in every field."); return; }
  if (password !== password2) { signupFail("Passwords don't match."); return; }
  if (password.length < 6) { signupFail("Password must be at least 6 characters."); return; }

  const { data, error } = await sb.auth.signUp({
    email, password,
    options: { data: { full_name: fullName } }
  });

  if (error) { signupFail(error.message); return; }

  if (data.session) {
    document.getElementById("signupOverlay").classList.add("hidden");
    state.operative = fullName;
    state.currentUserId = data.user.id;
    init();
    return;
  }

  document.getElementById("loginUsername").value = email;
  document.getElementById("loginPassword").value = "";
  showLogin();
}

async function doLogin() {
  const email = document.getElementById("loginUsername").value.trim().toLowerCase();
  const password = document.getElementById("loginPassword").value;

  if (!email || !password) { loginFail("Enter your username and password."); return; }

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { loginFail("Username or password is incorrect."); return; }

  document.getElementById("loginError").classList.add("hidden");
  const meta = data.user.user_metadata || {};
  state.operative = meta.full_name || "";
  state.currentUserId = data.user.id;
  document.getElementById("loginOverlay").classList.add("hidden");
  init();
}

async function forgotPassword() {
  const email = document.getElementById("loginUsername").value.trim().toLowerCase();
  const errEl = document.getElementById("loginError");

  if (!email) {
    errEl.textContent = "Type your username above first, then tap Forgot password.";
    errEl.classList.remove("hidden");
    return;
  }

  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });

  errEl.classList.remove("hidden");
  errEl.textContent = error ? error.message : "Check your email for a link to reset your password.";
}

async function logout() {
  await sb.auth.signOut();
  state.operative = null;
  state.currentUserId = null;
  document.getElementById("loginUsername").value = "";
  document.getElementById("loginPassword").value = "";
  showLogin();
}

sb.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    const newPassword = prompt("Enter a new password:");
    if (newPassword) {
      sb.auth.updateUser({ password: newPassword }).then(({ error }) => {
        alert(error ? "Could not update password: " + error.message : "Password updated. You're logged in.");
      });
    }
  }
});

// ---------- Data ----------

async function loadWeekEntries(monday) {
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  const { data, error } = await sb
    .from("timesheet_entries")
    .select("*")
    .eq("user_id", state.currentUserId)
    .gte("entry_date", isoDate(monday))
    .lte("entry_date", isoDate(sunday));

  state.weekEntries = {};
  if (!error && data) {
    data.forEach(row => { state.weekEntries[row.entry_date] = row; });
  }
}

async function getSiteHistory() {
  const hist = {};
  DEFAULT_SITES.forEach(s => { hist[s] = 0; });
  const { data } = await sb
    .from("timesheet_entries")
    .select("site")
    .eq("user_id", state.currentUserId);
  if (data) {
    data.forEach(row => { hist[row.site] = (hist[row.site] || 0) + 1; });
  }
  return hist;
}

// ---------- UI flow ----------

function init() {
  document.getElementById("headerSubText").textContent = state.operative;
  showWeek();
}

async function showWeek() {
  document.getElementById("dayView").classList.add("hidden");
  document.getElementById("weekView").classList.remove("hidden");
  document.getElementById("backBtn").classList.add("hidden");
  await renderWeek();
}

async function renderWeek() {
  const today = new Date();
  const monday = getMonday(today);
  const friday = new Date(monday); friday.setDate(monday.getDate() + 4);
  document.getElementById("weekMeta").textContent = "Week ending " + fmtLong(friday);

  await loadWeekEntries(monday);

  const tilesEl = document.getElementById("tiles");
  tilesEl.innerHTML = "";

  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const iso = isoDate(d);
    const entry = state.weekEntries[iso];
    const btn = document.createElement("button");
    btn.className = "tile" + (entry ? " filled" : "") + (isoDate(d) === isoDate(today) ? " today" : "");
    btn.innerHTML = fmtShort(d) +
      (entry ? '<span class="day-hours">' + fmtHM(entry.hours) + ' — ' + escapeHtml(entry.site) + '</span>' : "");
    btn.onclick = () => openDay(iso);
    tilesEl.appendChild(btn);
  }
}

async function openDay(iso) {
  state.currentDay = iso;
  document.getElementById("weekView").classList.add("hidden");
  document.getElementById("dayView").classList.remove("hidden");
  document.getElementById("backBtn").classList.remove("hidden");

  const entry = state.weekEntries[iso];
  await populateSites(entry);

  document.getElementById("newSiteField").classList.add("hidden");
  document.getElementById("newSiteInput").value = "";
  document.getElementById("descInput").value = entry ? (entry.description || "") : "";
  document.getElementById("startInput").value = entry ? entry.start_time : "08:00";
  document.getElementById("finishInput").value = entry ? entry.finish_time : "17:00";
  document.getElementById("lunchInput").value = entry ? entry.lunch_mins : 30;
  document.getElementById("notesInput").value = entry ? (entry.notes || "") : "";

  recalcHours();
}

async function populateSites(entry) {
  const hist = await getSiteHistory();
  const names = Object.keys(hist).sort((a,b) => hist[b]-hist[a]);
  const sel = document.getElementById("siteSelect");
  sel.innerHTML = "";
  names.forEach(n => {
    const opt = document.createElement("option");
    opt.value = n; opt.textContent = n;
    sel.appendChild(opt);
  });
  if (entry) {
    if (![...sel.options].some(o => o.value === entry.site)) {
      const opt = document.createElement("option");
      opt.value = entry.site; opt.textContent = entry.site;
      sel.insertBefore(opt, sel.firstChild);
    }
    sel.value = entry.site;
  }
}

function showAddSite() {
  document.getElementById("newSiteField").classList.remove("hidden");
  document.getElementById("newSiteInput").focus();
}

function onSiteChange() {}

function recalcHours() {
  const start = document.getElementById("startInput").value;
  const finish = document.getElementById("finishInput").value;
  const enteredLunch = parseFloat(document.getElementById("lunchInput").value) || 0;

  let hours = 0;
  let netMins = 0;

  if (start && finish) {
    const [sh, sm] = start.split(":").map(Number);
    const [fh, fm] = finish.split(":").map(Number);
    let diff = (fh*60+fm) - (sh*60+sm);
    if (diff < 0) diff += 24*60;
    netMins = Math.max(0, diff - enteredLunch);
    hours = netMins / 60;
  }

  const wholeHours = Math.floor(netMins / 60);
  const remMins = Math.round(netMins % 60);
  document.getElementById("hoursDisplay").textContent = "Hours: " + wholeHours + "h " + remMins + "m";
  return hours;
}

function pushToJobPlanner(entry) {
  fetch(PLANNER_URL + "/rest/v1/rpc/upsert_dgc_timesheet", {
    method: "POST",
    headers: {
      apikey: PLANNER_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      p_staff_name: state.operative,
      p_work_date: entry.entry_date,
      p_site: entry.site,
      p_description: entry.description,
      p_start_time: entry.start_time,
      p_finish_time: entry.finish_time,
      p_lunch_mins: entry.lunch_mins,
      p_hours: entry.hours,
      p_notes: entry.notes
    })
  }).catch(() => {});
}

async function saveDay() {
  const newSite = document.getElementById("newSiteInput").value.trim();
  let site = newSite || document.getElementById("siteSelect").value;
  if (!site) { alert("Please choose or add a site."); return; }

  const hours = recalcHours();
  const saveBtn = document.getElementById("saveDayBtn");
  saveBtn.disabled = true;

  const entry = {
    user_id: state.currentUserId,
    entry_date: state.currentDay,
    site: site,
    description: document.getElementById("descInput").value.trim(),
    start_time: document.getElementById("startInput").value,
    finish_time: document.getElementById("finishInput").value,
    lunch_mins: parseFloat(document.getElementById("lunchInput").value) || 0,
    hours: hours,
    notes: document.getElementById("notesInput").value.trim()
  };

  const { error } = await sb.from("timesheet_entries").upsert(entry, { onConflict: "user_id,entry_date" });

  saveBtn.disabled = false;

  if (error) { alert("Couldn't save: " + error.message); return; }

  pushToJobPlanner(entry);

  document.getElementById("headerTitle").textContent = "";
  showWeek();
}

// Boot
(async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    const meta = session.user.user_metadata || {};
    state.operative = meta.full_name || "";
    state.currentUserId = session.user.id;
    init();
  } else {
    showLogin();
  }
})();
</script>
