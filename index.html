    --navy: #0b3d6c;
    --orange: #dd7817;

    /* One fixed dark/amber theme app-wide, matching the login screen —
       deliberately not adaptive to system light/dark mode. */
    --bg: #0d1117;
    --surface: #1a1d27;
    --input-bg: rgba(0, 0, 0, 0.3);
    --input-border: rgba(245, 158, 11, 0.25);
    --tile-empty: #242938;
    --tile-empty-text: #9aa5b0;
    --border: #2e3347;
    --text: #eef2f5;
    --text-muted: #94a3b8;
    --focus-ring: #f59e0b;
    --link-accent: #f59e0b;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #0d1117 0%, #1a1d27 60%, #1e2538 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }
  h1 {
    font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--surface);
    display: flex;
    flex-direction: column;
  }
  header {
    background: transparent;
    border-bottom: 1px solid var(--border);
    color: #fff;
    padding: 16px 20px 16px;
  }
  .header-logo {
    display: block;
    width: 220px;
    height: 60px;
    margin: 0 auto 10px;
  }
  .brand-logo-bg {
    background-image: var(--dgc-logo);
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }
  header h1 {
    margin: 0;
    font-size: clamp(1.1rem, 4.5vw, 1.35rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  header h1:empty { display: none; }
  header .sub {
    margin-top: 6px;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.82);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header .sub button {
    background: none;
    border: none;
    color: rgba(255,255,255,0.82);
    text-decoration: underline;
    text-underline-offset: 2px;
    font-size: 0.8rem;
    padding: 4px 0;
    cursor: pointer;
    font-family: inherit;
  }
  header .sub button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 2px; }
  main {
    flex: 1;
    padding: 18px 20px 40px;
  }
  .week-meta {
    font-size: 0.95rem;
    color: var(--text-muted);
    margin-bottom: 18px;
  }
  .tiles {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .tile {
    width: 100%;
    border: none;
    border-radius: 8px;
    padding: 16px 14px;
    font-size: 1rem;
    font-weight: 700;
    font-family: "Archivo", inherit;
    letter-spacing: -0.005em;
    color: var(--tile-empty-text);
    background: var(--tile-empty);
    text-align: center;
    cursor: pointer;
    transition: transform 0.05s ease;
  }
  @media (prefers-reduced-motion: no-preference) {
    .tile:active { transform: scale(0.98); }
  }
  .tile.filled {
    background: var(--navy);
    color: #fff;
    border-left: 3px solid var(--orange);
  }
  .tile.holiday {
    background: repeating-linear-gradient(135deg, var(--tile-empty), var(--tile-empty) 10px, var(--border) 10px, var(--border) 20px);
    color: var(--text-muted);
    cursor: not-allowed;
  }
  .tile.today { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--orange); }
  .tile:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
  .tile .day-hours {
    display: block;
    font-weight: 500;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.78rem;
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
    opacity: 0.92;
  }
  .save-btn, .primary-btn {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 800;
    font-family: "Archivo", inherit;
    letter-spacing: 0.03em;
    color: #1a1d27;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    cursor: pointer;
    margin-top: 22px;
    box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .save-btn:hover, .primary-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(245, 158, 11, 0.5); }
  .save-btn:active, .primary-btn:active { transform: translateY(0); }
  .save-btn:focus-visible, .primary-btn:focus-visible {
    outline: 3px solid #f59e0b; outline-offset: 2px;
  }
  .save-btn:disabled { background: #7a5a20; color: #cbd5e1; cursor: not-allowed; box-shadow: none; }
  .primary-btn { margin-top: 6px; }

  /* Day entry screen */
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 0.83rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 7px;
  }
  .field select, .field input[type=text], .field input[type=time],

<body>

<div class="app">

  <div id="upd-banner" onclick="applyUpdate()">New version available — tap to update</div>

  <header>
    <button class="back-link hidden" id="backBtn" onclick="showWeek()">&larr; Back</button>
    <div class="header-logo brand-logo-bg"></div>
    <h1 id="headerTitle"></h1>
    <div class="sub" id="headerSub">
      <span id="headerSubText"></span>
      <button onclick="logout()">Log out</button>
    </div>
  </header>

  <main>

    <!-- WEEK VIEW -->
    <section id="weekView">
      <div class="week-meta" id="weekMeta"></div>
      <div class="tiles" id="tiles"></div>
    </section>

    <!-- DAY VIEW -->
    <section id="dayView" class="hidden">

      <div class="field">
        <label>Site</label>
        <select id="siteSelect" onchange="onSiteChange()"></select>
        <a class="add-site-link" id="addSiteLink" onclick="showAddSite()">+ Add new site</a>
        <div class="field hidden" id="newSiteField" style="margin-top:10px;">
          <input type="text" id="newSiteInput" placeholder="Type new site name">
        </div>
      </div>

      <div class="field">
        <label>Description of Work</label>
        <textarea id="descInput" placeholder="e.g. Excavating trench, laying pipe..."></textarea>

        <div class="field">

        <div class="field">

<!-- Name entry overlay -->
<div class="overlay hidden" id="loginOverlay">

</div>

<div class="overlay hidden" id="signupOverlay">
  <div class="overlay-card">
    <button class="overlay-back" onclick="showLogin()">&larr; Back</button>

    <div class="field">

    <button class="primary-btn" onclick="doSignup()">Save</button>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://kvxixpkprviimrozkfgz.supabase.co";
const SUPABASE_KEY = "sb_publishable_wIfFsbeoI-Oh220m4P0yOw_CSAhM6DI";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Job Planner (WEBSITE/dgc-ballasalla) — separate Supabase project. Entries are
// written through to its dgc_timesheets table so PMs see them there too.
const PLANNER_URL = "https://vigdtpcgeqenznuakdwz.supabase.co";
const PLANNER_KEY = "sb_publishable_nUG65QtsU2p1-hWpdUuaSQ_bF4G1EGQ";

const DAY_NAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DEFAULT_SITES = ["Peel Breakwater", "Dandara - Ballasalla", "Living Hope", "Utmost", "NRV", "Minor Works"];

// Isle of Man bank holidays — confirmed dates from gov.im (2026 only; add 2027
// once the Isle of Man Government publishes it). These days are locked in the
// week view so staff can't log hours on them and get paid twice.
const BANK_HOLIDAYS = new Set([
  "2026-01-01", // New Year's Day
  "2026-04-03", // Good Friday
  "2026-04-06", // Easter Monday
  "2026-05-04", // Early May Bank Holiday
  "2026-05-25", // Spring Bank Holiday
  "2026-06-05", // TT Bank Holiday
  "2026-07-06", // Tynwald Day
  "2026-08-31", // Summer Bank Holiday
  "2026-12-25", // Christmas Day
  "2026-12-28"  // Substitute for Boxing Day
]);

let state = {
  operative: null,
  currentUserId: null,
  currentDay: null,
  weekEntries: {}
};

function pad(n) { return n < 10 ? "0" + n : "" + n; }
function fmtHM(hoursDecimal) {
  const totalMins = Math.round(hoursDecimal * 60);
  const h = Math.floor(totalMins / 60);
  const m = totalMins % 60;
  return h + "h " + m + "m";
}
function isoDate(d) { return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function fmtShort(d) { return DAY_NAMES[(d.getDay()+6)%7] + " " + pad(d.getDate()) + " " + MONTH_NAMES[d.getMonth()]; }
function fmtLong(d) { return pad(d.getDate()) + "/" + pad(d.getMonth()+1) + "/" + d.getFullYear(); }

function getMonday(d) {
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7;
  date.setDate(date.getDate() - day);
  date.setHours(0,0,0,0);
  return date;
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

// ---------- Auth ----------

function showLogin() {
  document.getElementById("signupOverlay").classList.add("hidden");
  document.getElementById("loginError").classList.add("hidden");
  document.getElementById("loginOverlay").classList.remove("hidden");
}

async function showSignup() {
  document.getElementById("loginOverlay").classList.add("hidden");
  const err = document.getElementById("signupError");
  err.classList.add("hidden");
  err.textContent = "";
  document.getElementById("signupUsername").value = "";
  document.getElementById("signupEmail").value = "";
  document.getElementById("signupPassword").value = "";
  document.getElementById("signupPassword2").value = "";
  document.getElementById("signupOverlay").classList.remove("hidden");
  await populateStaffNames();
}

async function populateStaffNames() {
  const sel = document.getElementById("signupNameSelect");
  sel.innerHTML = '<option value="">Loading staff list...</option>';
  try {
    const r = await fetch(
      PLANNER_URL + "/rest/v1/dgc_staff?select=name&status=eq.Working&order=name",
      { headers: { apikey: PLANNER_KEY } }
    );
    if (!r.ok) throw new Error("bad response");
    const rows = await r.json();
    sel.innerHTML = '<option value="">Select your name...</option>';
    rows.forEach(row => {
      const opt = document.createElement("option");
      opt.value = row.name; opt.textContent = row.name;
      sel.appendChild(opt);
    });
  } catch (e) {
    sel.innerHTML = '<option value="">Couldn\'t load staff list — try again</option>';
  }
}

function signupFail(msg) {
  const err = document.getElementById("signupError");
  err.textContent = msg;
  err.classList.remove("hidden");
}

function loginFail(msg) {
  const err = document.getElementById("loginError");
  err.textContent = msg;
  err.classList.remove("hidden");
}

async function doSignup() {
  const fullName = document.getElementById("signupNameSelect").value;
  const username = document.getElementById("signupUsername").value.trim().toLowerCase();
  const email = document.getElementById("signupEmail").value.trim().toLowerCase();
  const password = document.getElementById("signupPassword").value;
  const password2 = document.getElementById("signupPassword2").value;

  if (!fullName || !username || !email || !password) { signupFail("Please fill in every field."); return; }
  if (password !== password2) { signupFail("Passwords don't match."); return; }
  if (password.length < 6) { signupFail("Password must be at least 6 characters."); return; }

  const { data: existing } = await sb.from("timesheet_usernames").select("username").eq("username", username).maybeSingle();
  if (existing) { signupFail("That username is already taken — pick another."); return; }

  const { data, error } = await sb.auth.signUp({
    email, password,
    options: { data: { full_name: fullName } }
  });

  if (error) { signupFail(error.message); return; }

  await sb.from("timesheet_usernames").insert({ username, user_id: data.user.id, email });

  if (data.session) {
    document.getElementById("signupOverlay").classList.add("hidden");
    state.operative = fullName;
    state.currentUserId = data.user.id;
    init();
    return;
  }

  document.getElementById("loginUsername").value = username;
  document.getElementById("loginPassword").value = "";
  showLogin();
}

async function doLogin() {
  const username = document.getElementById("loginUsername").value.trim().toLowerCase();
  const password = document.getElementById("loginPassword").value;

  if (!username || !password) { loginFail("Enter your username and password."); return; }

  const { data: match } = await sb.from("timesheet_usernames").select("email").eq("username", username).maybeSingle();
  if (!match) { loginFail("Username or password is incorrect."); return; }

  const { data, error } = await sb.auth.signInWithPassword({ email: match.email, password });
  if (error) { loginFail("Username or password is incorrect."); return; }

  document.getElementById("loginError").classList.add("hidden");
  const meta = data.user.user_metadata || {};
  state.operative = meta.full_name || "";
  state.currentUserId = data.user.id;
  document.getElementById("loginOverlay").classList.add("hidden");
  init();
}

async function forgotPassword() {
  const username = document.getElementById("loginUsername").value.trim().toLowerCase();
  const errEl = document.getElementById("loginError");

  if (!username) {
    errEl.textContent = "Type your username above first, then tap Forgot password.";
    errEl.classList.remove("hidden");
    return;
  }

  const { data: match } = await sb.from("timesheet_usernames").select("email").eq("username", username).maybeSingle();

  errEl.classList.remove("hidden");
  if (!match) { errEl.textContent = "Check your email for a link to reset your password."; return; }

  const { error } = await sb.auth.resetPasswordForEmail(match.email, {
    redirectTo: window.location.origin + window.location.pathname
  });

  errEl.textContent = error ? error.message : "Check your email for a link to reset your password.";
}

async function logout() {
  await sb.auth.signOut();
  state.operative = null;
  state.currentUserId = null;
  document.getElementById("loginUsername").value = "";
  document.getElementById("loginPassword").value = "";
  showLogin();
}

sb.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    const newPassword = prompt("Enter a new password:");
    if (newPassword) {
      sb.auth.updateUser({ password: newPassword }).then(({ error }) => {
        alert(error ? "Could not update password: " + error.message : "Password updated. You're logged in.");
      });
    }
  }
});

// ---------- Data ----------

async function loadWeekEntries(monday) {
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  const { data, error } = await sb
    .from("timesheet_entries")
    .select("*")
    .eq("user_id", state.currentUserId)
    .gte("entry_date", isoDate(monday))
    .lte("entry_date", isoDate(sunday));

  state.weekEntries = {};
  if (!error && data) {
    data.forEach(row => { state.weekEntries[row.entry_date] = row; });
  }
}

async function getSiteList() {
  const { data } = await sb.from("timesheet_sites").select("name").order("name");
  if (data && data.length) return data.map(r => r.name);
  return DEFAULT_SITES.slice();
}

// ---------- UI flow ----------

function init() {
  document.getElementById("headerSubText").textContent = state.operative;
  showWeek();
}

async function showWeek() {
  document.getElementById("dayView").classList.add("hidden");
  document.getElementById("weekView").classList.remove("hidden");
  document.getElementById("backBtn").classList.add("hidden");
  await renderWeek();
}

async function renderWeek() {
  const today = new Date();
  const monday = getMonday(today);
  const friday = new Date(monday); friday.setDate(monday.getDate() + 4);
  document.getElementById("weekMeta").textContent = "Week ending " + fmtLong(friday);

  await loadWeekEntries(monday);

  const tilesEl = document.getElementById("tiles");
  tilesEl.innerHTML = "";

  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const iso = isoDate(d);
    const entry = state.weekEntries[iso];
    const isHoliday = BANK_HOLIDAYS.has(iso);
    const btn = document.createElement("button");
    btn.className = "tile" +
      (isHoliday ? " holiday" : (entry ? " filled" : "")) +
      (isoDate(d) === isoDate(today) ? " today" : "");
    if (isHoliday) {
      btn.innerHTML = fmtShort(d) + '<span class="day-hours">Bank Holiday</span>';
      btn.disabled = true;
    } else {
      btn.innerHTML = fmtShort(d) +
        (entry ? '<span class="day-hours">' + fmtHM(entry.hours) + ' — ' + escapeHtml(entry.site) + '</span>' : "");
      btn.onclick = () => openDay(iso);
    }
    tilesEl.appendChild(btn);
  }
}

async function openDay(iso) {
  if (BANK_HOLIDAYS.has(iso)) return;
  state.currentDay = iso;
  document.getElementById("weekView").classList.add("hidden");
  document.getElementById("dayView").classList.remove("hidden");
  document.getElementById("backBtn").classList.remove("hidden");

  const entry = state.weekEntries[iso];
  await populateSites(entry);

  document.getElementById("newSiteField").classList.add("hidden");
  document.getElementById("newSiteInput").value = "";
  document.getElementById("descInput").value = entry ? (entry.description || "") : "";
  document.getElementById("startInput").value = entry ? entry.start_time : "08:00";
  document.getElementById("finishInput").value = entry ? entry.finish_time : "17:00";
  document.getElementById("lunchInput").value = entry ? entry.lunch_mins : 30;
  document.getElementById("notesInput").value = entry ? (entry.notes || "") : "";

  recalcHours();
}

async function populateSites(entry) {
  const names = await getSiteList();
  const sel = document.getElementById("siteSelect");
  sel.innerHTML = "";
  names.forEach(n => {
    const opt = document.createElement("option");
    opt.value = n; opt.textContent = n;
    sel.appendChild(opt);
  });
  if (entry) {
    if (![...sel.options].some(o => o.value === entry.site)) {
      const opt = document.createElement("option");
      opt.value = entry.site; opt.textContent = entry.site;
      sel.insertBefore(opt, sel.firstChild);
    }
    sel.value = entry.site;
  }
}

function showAddSite() {
  document.getElementById("newSiteField").classList.remove("hidden");
  document.getElementById("newSiteInput").focus();
}

function onSiteChange() {}

function recalcHours() {
  const start = document.getElementById("startInput").value;
  const finish = document.getElementById("finishInput").value;
  const enteredLunch = parseFloat(document.getElementById("lunchInput").value) || 0;

  let hours = 0;
  let netMins = 0;

  if (start && finish) {
    const [sh, sm] = start.split(":").map(Number);
    const [fh, fm] = finish.split(":").map(Number);
    let diff = (fh*60+fm) - (sh*60+sm);
    if (diff < 0) diff += 24*60;
    netMins = Math.max(0, diff - enteredLunch);
    hours = netMins / 60;
  }

  const wholeHours = Math.floor(netMins / 60);
  const remMins = Math.round(netMins % 60);
  document.getElementById("hoursDisplay").textContent = "Hours: " + wholeHours + "h " + remMins + "m";
  return hours;
}

function pushToJobPlanner(entry) {
  fetch(PLANNER_URL + "/rest/v1/rpc/upsert_dgc_timesheet", {
    method: "POST",
    headers: {
      apikey: PLANNER_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      p_staff_name: state.operative,
      p_work_date: entry.entry_date,
      p_site: entry.site,
      p_description: entry.description,
      p_start_time: entry.start_time,
      p_finish_time: entry.finish_time,
      p_lunch_mins: entry.lunch_mins,
      p_hours: entry.hours,
      p_notes: entry.notes
    })
  }).catch(() => {});
}

async function saveDay() {
  const newSite = document.getElementById("newSiteInput").value.trim();
  let site = newSite || document.getElementById("siteSelect").value;
  if (!site) { alert("Please choose or add a site."); return; }

  const hours = recalcHours();
  const saveBtn = document.getElementById("saveDayBtn");
  saveBtn.disabled = true;

  if (newSite) {
    try {
      await sb.from("timesheet_sites").upsert({ name: newSite }, { onConflict: "name", ignoreDuplicates: true });
    } catch (e) {}
  }

  const entry = {
    user_id: state.currentUserId,
    entry_date: state.currentDay,
    site: site,
    description: document.getElementById("descInput").value.trim(),
    start_time: document.getElementById("startInput").value,
    finish_time: document.getElementById("finishInput").value,
    lunch_mins: parseFloat(document.getElementById("lunchInput").value) || 0,
    hours: hours,
    notes: document.getElementById("notesInput").value.trim()
  };

  const { error } = await sb.from("timesheet_entries").upsert(entry, { onConflict: "user_id,entry_date" });

  saveBtn.disabled = false;

  if (error) { alert("Couldn't save: " + error.message); return; }

  pushToJobPlanner(entry);

  document.getElementById("headerTitle").textContent = "";
  showWeek();
}

// ---------- Update banner ----------
let swReg = null;
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(r => {
    swReg = r;
    r.addEventListener("updatefound", () => {
      const w = r.installing;
      w.addEventListener("statechange", () => {
        if (w.state === "installed" && navigator.serviceWorker.controller) {
          document.getElementById("upd-banner").style.display = "block";
        }
      });
    });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => location.reload());
}
function applyUpdate() {
  if (swReg && swReg.waiting) swReg.waiting.postMessage({ type: "SKIP_WAITING" });
}

// Boot
(async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    const meta = session.user.user_metadata || {};
    state.operative = meta.full_name || "";
    state.currentUserId = session.user.id;
    init();
  } else {
    showLogin();
  }
})();
</script>
